<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parla Cat RPG - Cròniques de Catalunya</title>
<meta name="description" content="RPG per aprendre català jugant">
<meta name="theme-color" content="#FF6B35">
<link rel="manifest" href="./manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root[data-totem="rauxa"] { --bg: linear-gradient(135deg, #FF6B35 0%, #FF006E 100%); }
:root[data-totem="seny"] { --bg: linear-gradient(135deg, #0A2463 0%, #FFC72C 100%); }
:root[data-totem="arrel"] { --bg: linear-gradient(135deg, #2E7D32 0%, #8D6E63 100%); }
:root[data-totem="obert"] { --bg: linear-gradient(135deg, #7B1FA2 0%, #FF4081 100%); }
:root { --bg: linear-gradient(135deg, #FFD700 0%, #C8102E 100%); }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0a0f;
  color: #fff;
  padding-bottom: 80px;
}

.header {
  background: var(--bg);
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #6B4F3A;
  transition: background 0.8s ease;
}
.header h1 { font-size: 22px; margin-bottom: 5px; color: #0a0a0f; font-weight: 800; }
.coins { font-size: 18px; font-weight: bold; color: #0a0a0f; }
.stats { font-size: 12px; color: #0a0a0f; margin-top: 5px; }

.tab-content { display: none; padding: 20px; }
.tab-content.active { display: block; }

.tabs {
  display: flex;
  background: #1a1a24;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  border-top: 1px solid #333;
  z-index: 1000;
}
.tab-btn {
  flex: 1;
  padding: 12px;
  background: none;
  border: none;
  color: #888;
  font-size: 12px;
  cursor: pointer;
}
.tab-btn.active {
  color: #FFD700;
  background: rgba(255, 215, 0, 0.1);
  border-top: 2px solid #FFD700;
}

.card {
  background: #1a1a24;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid #2a2a35;
}

.btn {
  background: linear-gradient(135deg, #C8102E 0%, #A60A24 100%);
  color: #fff;
  border: 1px solid #FFD700;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  width: 100%;
  margin-top: 15px;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sec { background: #2a2a35; border: 1px solid #555; }

.opcio {
  background: #2a2a35;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.opcio:hover { background: #3a3a45; }
.opcio.disabled { pointer-events: none; opacity: 0.6; }

.capitol-card {
  background: linear-gradient(135deg, #1a1a24 0%, #2a2a35 100%);
  border: 2px solid #C8102E;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
}
.capitol-card.completat { border-color: #4CAF50; }
.capitol-card.bloquejat { opacity: 0.5; }

.capitol-icona { font-size: 48px; text-align: center; margin-bottom: 10px; }

.npc-box {
  background: #2a2a35;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 15px;
  border-left: 4px solid #FFD700;
}
.npc-nom { color: #FFD700; font-weight: bold; margin-bottom: 5px; }

.gremi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.gremi-item {
  background: #1a1a24;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #2a2a35;
}

.sub-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
.sub-tab-btn {
  flex: 1;
  padding: 10px;
  background: #1a1a24;
  border: 1px solid #2a2a35;
  color: #888;
  border-radius: 8px;
  cursor: pointer;
}
.sub-tab-btn.active { background: #FFD700; color: #0a0a0f; font-weight: bold; }

.completion-screen { text-align: center; padding: 40px 20px; }
.completion-screen h2 { font-size: 28px; color: #4CAF50; margin-bottom: 15px; }
.completion-screen p { font-size: 16px; color: #ccc; margin-bottom: 25px; }
.completion-buttons { display: flex; gap: 10px; }

/* FEEDBACK 4S CON BARRA */
#feedback-box {
  background: #2a2a35;
  padding: 20px;
  border-radius: 12px;
  margin: 15px 0;
  border: 2px solid #FFD700;
  animation: fadeIn 0.3s;
}

#feedback-barra {
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #FF6B35, #FF006E);
  transform-origin: left;
  animation: llegir 4s linear forwards;
  margin-top: 15px;
  border-radius: 2px;
}

@keyframes llegir {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ITEM DESBLOQUEADO */
.item-desbloquejat {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #FFD70020, #C8102E20);
  border: 2px solid #FFD700;
  border-radius: 12px;
  animation: bounceIn 0.6s;
}

.item-desbloquejat img {
  width: 120px;
  height: 120px;
  margin-bottom: 15px;
}

@keyframes bounceIn {
 0% { transform: scale(0.3); opacity: 0; }
 50% { transform: scale(1.05); }
 100% { transform: scale(1); opacity: 1; }
}

/* RUTAS SECRETAS */
.capitol-card.ruta-secreta {
  border: 2px solid #9C27B0;
  background: linear-gradient(135deg, #1a1a24 0%, #2a1a35 100%);
  box-shadow: 0 0 15px rgba(156, 39, 176, 0.3);
}

.capitol-card.ruta-secreta .capitol-icona {
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #9C27B0; }
  to { text-shadow: 0 0 20px #9C27B0, 0 0 30px #9C27B0; }
}
</style>
</head>
<body>

<div class="header" id="header">
  <h1 id="app-titol">🏴 Parla Cat RPG</h1>
  <div class="coins" id="coins">🪙 0 <span id="text-monedes">Monedes</span></div>
  <div class="stats" id="stats">Seny: 0 | Rauxa: 0 | Arrel: 0 | Obert: 0</div>
  <div class="stats" id="totem-display"></div>
</div>

<div id="tab-mapa" class="tab-content active">
  <h2 id="text-mon">🗺️ Mapa de Catalunya</h2>
  <div id="mapa"></div>
</div>

<div id="tab-missio" class="tab-content">
  <div id="npc-box" class="npc-box" style="display:none;">
    <div class="npc-nom" id="npc-nom"></div>
    <div id="npc-text"></div>
  </div>
  <div class="card" id="missio-card">
    <h3 id="missio-titol">Selecciona una missió al mapa</h3>
    <div id="missio-escenari"></div>
    <div id="missio-opcions"></div>
    <div id="missio-feedback"></div>
  </div>
</div>

<div id="tab-gremi" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" onclick="mostrarGremi('personatges', event)">👥 Personatges</button>
    <button class="sub-tab-btn" onclick="mostrarGremi('objectes', event)">🎒 Objectes</button>
    <button class="sub-tab-btn" onclick="mostrarGremi('llegendes', event)">📜 Llegendes</button>
  </div>
  <div id="gremi-contenidor" class="gremi-grid"></div>
</div>

<div id="tab-botiga" class="tab-content">
  <div class="card">
    <h3 id="text-botiga">🛒 Botiga</h3>
    <div id="botiga-contenidor" class="gremi-grid"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="canviarTab('mapa', event)">🗺️ <span id="tab-mapa-txt">Món</span></button>
  <button class="tab-btn" onclick="canviarTab('missio', event)">📜 <span id="tab-missio-txt">Missió</span></button>
  <button class="tab-btn" onclick="canviarTab('gremi', event)">🏛️ <span id="tab-gremi-txt">Gremi</span></button>
  <button class="tab-btn" onclick="canviarTab('botiga', event)">🛒 <span id="tab-botiga-txt">Botiga</span></button>
</div>

<script src="./main.js"></script>
</body>
</html>
